<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আবাসিক গ্যাস ম্যানেজমেন্ট সিস্টেম</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-blue-800 to-blue-600 text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-bold mb-1">🏠 জামিলা ভবন গ্যাস ম্যানেজমেন্ট সিস্টেম</h1>
        <p class="text-sm opacity-90">মডেল সিটি, মৌচাক, কালিয়াকৈর, গাজীপুর</p>
        <p class="text-sm opacity-90">৮ তলা ভবন | মোট মিটার: ২৮ টি</p>
    </header>

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        
        <!-- Main Admin Dashboard Panel -->
        <section class="bg-white rounded-xl shadow-md p-6 mb-8 border-t-4 border-blue-600">
            <h2 class="text-xl font-bold mb-4 text-blue-700 border-b pb-2">📊 মেইন ড্যাশবোর্ড (চলতি মাস)</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">সাব-স্টেশন মোট কেনা গ্যাস (টাকা)</label>
                    <input type="number" id="mainTotalTk" class="w-full bg-white border border-gray-300 rounded px-2 py-1 text-xl font-bold text-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-400" value="15000">
                </div>
                <div class="bg-green-50 p-4 rounded-lg border border-green-100">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">সাব-স্টেশন মোট ইউনিট (m³)</label>
                    <input type="number" id="mainTotalUnit" class="w-full bg-white border border-gray-300 rounded px-2 py-1 text-xl font-bold text-green-900 focus:outline-none focus:ring-2 focus:ring-green-400" value="1000">
                </div>
                <div class="bg-purple-50 p-4 rounded-lg border border-purple-100">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">২৮টি মিটারে মোট পুড়ছে (ইউনিট)</label>
                    <div id="calcTotalUnit" class="text-xl font-bold text-purple-900 mt-1">0.00</div>
                </div>
                <div class="bg-amber-50 p-4 rounded-lg border border-amber-100">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">মোট সংগৃহীত টাকা (বিল)</label>
                    <div id="calcTotalTk" class="text-xl font-bold text-amber-900 mt-1">৳ 0.00</div>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-3 justify-end">
                <button id="btnUpdate" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-sm transition duration-200 cursor-pointer">🔄 হিসাব আপডেট করুন</button>
                <button id="btnSave" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg shadow-sm transition duration-200 cursor-pointer">💾 ডাটা সেভ করুন</button>
                <button id="btnPrint" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg shadow-sm transition duration-200 cursor-pointer">📧 পিডিএফ/মেইল ব্যাকআপ</button>
            </div>
        </section>

        <!-- 28 Meter Profiles Table -->
        <section class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
            <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">🔑 ২৮টি ফ্ল্যাটের আলাদা প্রোফাইল ও মিটার রিডিং</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-left text-sm font-semibold border-b border-gray-200">
                            <th class="py-3 px-4 text-left">ফ্ল্যাট নম্বর</th>
                            <th class="py-3 px-4 text-left">মিটার নম্বর</th>
                            <th class="py-3 px-4 text-left">পূর্বের রিডিং</th>
                            <th class="py-3 px-4 text-left">বর্তমান রিডিং</th>
                            <th class="py-3 px-4 text-left">ব্যবহৃত ইউনিট</th>
                            <th class="py-3 px-4 text-left">মোট বিল (টাকা)</th>
                        </tr>
                    </thead>
                    <tbody id="meterTableBody" class="text-gray-600 text-sm divide-y divide-gray-100">
                        <!-- জাভাস্ক্রিপ্ট এখানে ২৮টি ফ্ল্যাটের ডাটা বসাবে -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- script.js ফাইলটিকে এখানে লিঙ্ক করা হলো -->
    <script src="script.js"></script>
</body>
</html>
